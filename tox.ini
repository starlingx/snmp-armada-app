[tox]
envlist = linters
minversion = 2.9
skipsdist = True
sitepackages=False

[testenv]
basepython = python3
install_command = pip install -U \
    {opts} {packages} \
    -c{env:TOX_CONSTRAINTS_FILE:https://opendev.org/starlingx/root/raw/branch/master/build-tools/requirements/debian/upper-constraints.txt}
setenv =
   VIRTUAL_ENV={envdir}
   OS_STDOUT_CAPTURE=1
   OS_STDERR_CAPTURE=1
   OS_DEBUG=1
   OS_LOG_CAPTURE=1
deps =
  -r{toxinidir}/requirements.txt
  -r{toxinidir}/test-requirements.txt
allowlist_externals =
  bash

[trixie]
basepython = python3
setenv = {[testenv]setenv}
         UPPER_CONSTRAINTS_FILE=https://opendev.org/starlingx/root/raw/branch/master/build-tools/requirements/debian/trixie/upper-constraints.txt
install_command = pip install \
    -c{env:UPPER_CONSTRAINTS_FILE} \
    {opts} {packages}

[testenv:flake8]
basepython = python3
description = Dummy environment to allow flake8 to be run in subdir tox

[testenv:pylint]
basepython = python3
description = Dummy environment to allow pylint to be run in subdir tox

[testenv:metadata]
basepython = python3
description = Dummy environment to allow sysinv-app to be run in subdir tox

[testenv:bandit]
basepython = python3
description = Run bandit security analysis
deps = bandit
allowlist_externals = bash
                      mkdir
commands =
  mkdir -p {toxinidir}/UTCoverage
  bash -c "bandit -r python3-k8sapp-snmp/k8sapp_snmp/k8sapp_snmp \
    -x '**/tests/**' -n 5 \
    -f txt -o {toxinidir}/UTCoverage/security_report.txt \
    --severity-level medium"
  bash -c "bandit -r python3-k8sapp-snmp/k8sapp_snmp/k8sapp_snmp \
    -x '**/tests/**' -n 5 \
    -f json -o {toxinidir}/UTCoverage/bandit-report.json \
    --severity-level medium"

[testenv:bashate]
# Treat all E* codes as Errors rather than warnings using: -e 'E*'
commands =
  bash -c "find {toxinidir}                    \
         -not \( -type d -name .?\* -prune \) \
         -type f                              \
         -not -name \*~                       \
         -not -name \*.md                     \
         -name \*.sh                          \
         -print0 | xargs -r -n 1 -0 bashate -v   \
         -e 'E*'"

[testenv:linters]
commands =
    {[testenv:bashate]commands}

[testenv:coverage]
allowlist_externals = bash
                      mkdir
commands =
  mkdir -p {toxinidir}/UTCoverage
  bash -c "cd python3-k8sapp-snmp/k8sapp_snmp && \
    tox -e coverage 2>&1 | \
    tee {toxinidir}/UTCoverage/coverage_report.txt"

[testenv:coverage-c]
allowlist_externals = bash
                      mkdir
                      which
                      gcc
                      gcov
                      lcov
                      genhtml
commands =
  mkdir -p {toxinidir}/UTCoverage
  bash -c "\
    if ! which gcc >/dev/null 2>&1; then \
      echo 'gcc not found - skipping C coverage' \
        > {toxinidir}/UTCoverage/coverage-c_skipped.txt; \
      exit 0; \
    fi; \
    echo 'C/C++ coverage requires full build toolchain.' \
      > {toxinidir}/UTCoverage/coverage-c_skipped.txt"

[testenv:linters-trixie]
basepython = {[trixie]basepython}
description = Run linters (Trixie)
setenv = {[trixie]setenv}
install_command = {[trixie]install_command}
allowlist_externals = {[testenv]allowlist_externals}
commands = {[testenv:linters]commands}

[testenv:bandit-trixie]
basepython = {[trixie]basepython}
description = Run bandit security analysis (Trixie)
deps = bandit
setenv = {[trixie]setenv}
install_command = {[trixie]install_command}
allowlist_externals = {[testenv:bandit]allowlist_externals}
commands = {[testenv:bandit]commands}

[testenv:coverage-trixie]
basepython = {[trixie]basepython}
description = Run coverage analysis (Trixie)
setenv = {[trixie]setenv}
install_command = {[trixie]install_command}
allowlist_externals = {[testenv:coverage]allowlist_externals}
commands = {[testenv:coverage]commands}

[testenv:coverage-c-trixie]
basepython = {[trixie]basepython}
description = Run C/C++ coverage analysis (Trixie)
allowlist_externals = {[testenv:coverage-c]allowlist_externals}
commands = {[testenv:coverage-c]commands}

