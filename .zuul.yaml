---
- project:
    check:
      jobs:
        - k8sapp-snmp-armada-tox-linters
        - k8app-snmp-armada-tox-py39
        - k8sapp-snmp-armada-tox-pylint
        - k8sapp-snmp-armada-tox-flake8
        - k8sapp-snmp-armada-tox-metadata
        - k8sapp-snmp-armada-tox-coverage
        - k8sapp-snmp-armada-tox-security
        - k8sapp-snmp-armada-tox-coverage-c
    gate:
      jobs:
        - k8sapp-snmp-armada-tox-linters
        - k8app-snmp-armada-tox-py39
        - k8sapp-snmp-armada-tox-pylint
        - k8sapp-snmp-armada-tox-flake8
        - k8sapp-snmp-armada-tox-metadata
        - k8sapp-snmp-armada-tox-coverage
        - k8sapp-snmp-armada-tox-security
        - k8sapp-snmp-armada-tox-coverage-c
    post:
      jobs:
        - stx-snmp-armada-app-upload-git-mirror

- job:
    name: k8sapp-snmp-armada-tox-linters
    parent: openstack-tox-linters
    description: |
      Run linters for snmp-armada-app
    nodeset: debian-bullseye
    post-run: python3-k8sapp-snmp/k8sapp_snmp/k8sapp_snmp/tests/playbooks/upload-linter-reports.yaml

- job:
    name: k8app-snmp-armada-tox-py39
    parent: openstack-tox-py39
    description: |
        Run py39 test for k8app-snmp-armada-app
    nodeset: debian-bullseye
    required-projects:
        - starlingx/config
        - starlingx/fault
        - starlingx/utilities
        - starlingx/root
    files:
        - python3-k8sapp-snmp/k8sapp_snmp/*
    vars:
        tox_extra_args: -c python3-k8sapp-snmp/k8sapp_snmp/tox.ini
        tox_constraints_file: '{{ ansible_user_dir }}/src/opendev.org/starlingx/root/build-tools/requirements/debian/upper-constraints.txt'

- job:
    name: k8sapp-snmp-armada-tox-pylint
    parent: tox
    description: |
      Run pylint test for k8sapp_snmp
    nodeset: debian-bullseye
    required-projects:
      - starlingx/config
      - starlingx/fault
      - starlingx/utilities
      - starlingx/root
    files:
      - python3-k8sapp-snmp/*
    vars:
      tox_envlist: pylint
      tox_extra_args: -c python3-k8sapp-snmp/k8sapp_snmp/tox.ini
      tox_constraints_file: '{{ ansible_user_dir }}/src/opendev.org/starlingx/root/build-tools/requirements/debian/upper-constraints.txt'

- job:
    name: k8sapp-snmp-armada-tox-flake8
    parent: tox
    description: |
      Run flake8 test for k8sapp_snmp
    nodeset: debian-bullseye
    required-projects:
      - starlingx/config
      - starlingx/fault
      - starlingx/utilities
      - starlingx/root
    files:
      - python3-k8sapp-snmp/*
    vars:
      tox_envlist: flake8
      tox_extra_args: -c python3-k8sapp-snmp/k8sapp_snmp/tox.ini
      tox_constraints_file: '{{ ansible_user_dir }}/src/opendev.org/starlingx/root/build-tools/requirements/debian/upper-constraints.txt'

- job:
    name: k8sapp-snmp-armada-tox-metadata
    parent: tox
    description: |
      Run metadata test for k8sapp_snmp
    nodeset: debian-bullseye
    required-projects:
      - starlingx/config
      - starlingx/fault
      - starlingx/utilities
      - starlingx/root
    vars:
      tox_envlist: metadata
      tox_extra_args: -c python3-k8sapp-snmp/k8sapp_snmp/tox.ini
      tox_constraints_file: '{{ ansible_user_dir }}/src/opendev.org/starlingx/root/build-tools/requirements/debian/upper-constraints.txt'

- job:
    name: k8sapp-snmp-armada-tox-coverage
    parent: tox
    description: |
      Run coverage analysis for k8sapp_snmp
    nodeset: debian-bullseye
    required-projects:
      - starlingx/config
      - starlingx/fault
      - starlingx/utilities
      - starlingx/root
    files:
      - python3-k8sapp-snmp/*
    vars:
      tox_envlist: coverage
      tox_extra_args: -c python3-k8sapp-snmp/k8sapp_snmp/tox.ini
      tox_constraints_file: '{{ ansible_user_dir }}/src/opendev.org/starlingx/root/build-tools/requirements/debian/upper-constraints.txt'
    post-run: python3-k8sapp-snmp/k8sapp_snmp/k8sapp_snmp/tests/playbooks/upload-coverage-reports.yaml

- job:
    name: k8sapp-snmp-armada-tox-security
    parent: tox
    description: |
      Run security analysis for k8sapp_snmp
    nodeset: debian-bullseye
    required-projects:
      - starlingx/root
    files:
      - python3-k8sapp-snmp/*
    vars:
      tox_envlist: security
      tox_extra_args: -c python3-k8sapp-snmp/k8sapp_snmp/tox.ini
      tox_constraints_file: '{{ ansible_user_dir }}/src/opendev.org/starlingx/root/build-tools/requirements/debian/upper-constraints.txt'
    post-run: python3-k8sapp-snmp/k8sapp_snmp/k8sapp_snmp/tests/playbooks/upload-security-reports.yaml

- job:
    name: k8sapp-snmp-armada-tox-coverage-c
    parent: tox
    description: |
      Run C/C++ coverage analysis via gcov/lcov
    nodeset: debian-bullseye
    vars:
      tox_envlist: coverage-c
    post-run: python3-k8sapp-snmp/k8sapp_snmp/k8sapp_snmp/tests/playbooks/upload-coverage-reports.yaml

- job:
    name: stx-snmp-armada-app-upload-git-mirror
    parent: upload-git-mirror
    description: >
      Mirrors opendev.org/starlingx/snmp-armada-app to
      github.com/starlingx/snmp-armada-app
    vars:
      git_mirror_repository: starlingx/snmp-armada-app
    secrets:
      - name: git_mirror_credentials
        secret: stx-snmp-armada-app-github-secret3
        pass-to-parent: true

